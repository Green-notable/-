<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#F6F3EC;color:#33302A;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:15px}
a{color:#1D6E5E}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 70px}
header.hero{background:#0E3B33;border-radius:14px;color:#EAF4F1;padding:26px 26px 22px;margin-bottom:16px}

.tb-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.card{background:#FFFDF8;border:1px solid #E2DCCB;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}

.card .pr{font-size:13.5px;line-height:1.8;color:#4A473E;margin-top:8px}

.more{font-size:12.5px;color:#1D6E5E;background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;font-family:inherit}

.demo .dtitle{font-size:12px;color:#1D6E5E;margin-bottom:8px;font-weight:bold}
.tag{display:inline-block;font-size:11px;color:#B7791F;border:1px solid #E3CE9E;background:#FBF4E4;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.safe{margin-top:8px;font-size:12.5px;color:#9B3A2E;background:#FBEEEA;border-radius:6px;padding:6px 10px;display:none}
.teacher .safe{display:block}
.teacher-only{display:none}
.teacher .teacher-only{display:block}
.sim{margin-top:4px}
.simstage svg{display:block;margin:0 auto;background:#FFFDF8;border:1px solid #E2DCCB;border-radius:9px;max-width:100%;height:auto}
.simstage{min-height:260px;display:flex;align-items:center;justify-content:center}
.sim canvas{display:block;margin:0 auto;background:#FFFDF8;border:1px solid #E2DCCB;border-radius:9px;max-width:100%}
.sbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:10px 0 4px;padding:8px 10px;background:#F2F6F4;border:1px solid #DCE7E2;border-radius:9px;font-size:13px}
.sctl{display:inline-flex;align-items:center;gap:6px;color:#4A473E}
.sctl input[type=range]{width:130px;accent-color:#1D6E5E}
.sctl select,.sctl input[type=number]{padding:3px 6px;border:1px solid #C9BFA4;border-radius:6px;font-size:13px;background:#FFFDF8;font-family:inherit;color:#33302A}
.sbtn{padding:5px 14px;border-radius:8px;border:1px solid #1D6E5E;background:#1D6E5E;color:#FFFDF8;font-size:13px;cursor:pointer;font-family:inherit}
.sbtn.ghost{background:#FFFDF8;color:#1D6E5E}
.snote{font-size:13px;color:#5A564A;line-height:1.8;margin-top:6px;min-height:20px}
#demoModal{position:fixed;inset:0;background:rgba(20,20,15,.55);display:none;z-index:100;padding:24px;overflow:auto}
#demoModal.show{display:block}
.modal-in{max-width:860px;margin:0 auto;background:#FFFDF8;border-radius:14px;padding:22px 24px 26px;position:relative}
.modal-in h2{margin:0 0 2px;font-size:20px;color:#143D36}
.modal-in .msub{font-size:13px;color:#8A8168;margin:0 0 14px}
.modal-close{position:absolute;top:10px;right:14px;font-size:22px;background:none;border:none;color:#8A8168;cursor:pointer}
footer{margin-top:30px;border-top:1px solid #E2DCCB;padding-top:14px;font-size:12px;color:#9A9179;line-height:1.9}
.empty{display:none;text-align:center;color:#9A9179;padding:40px 0;font-size:14px}
@media print{.toolbar,.modebtn,footer{display:none}.card .detail{display:block}}
</style>
</head>

<div class="wrap">

<script>
var DOMS=["物质科学","生命科学","地球与宇宙","技术与工程","拓展实验","水的奥秘"];
var GRADES=["三年级上","三年级下","四年级上","四年级下","五年级上","五年级下","六年级上","六年级下"];
var D_COLOR={"物质科学":"#1D6E5E","生命科学":"#3E7B27","地球与宇宙":"#185FA5","技术与工程":"#99552B","拓展实验":"#7A4FA3","水的奥秘":"#2277AA"};
var E=[];
function add(grade,dom,name,star,principle,equip,ask,demo,teacher,safe){E.push({g:grade,d:dom,n:name,s:!!star,p:principle,e:equip,a:ask,m:demo,t:teacher,sf:safe});}

add("三年级上","物质科学","水结冰了",1,"水温度降到 0°C 开始结冰，结冰时温度保持不变。水结冰后体积会变大——所以冰浮在水面上。","烧杯、试管、碎冰、食盐、温度计",["结冰的过程中温度会一直下降吗？","冬天水管为什么会冻裂？"],"三态实验台","冰盐混合物约 −10°C，可让试管里的水结冰。让学生每隔 1 分钟读一次温度并记录。","");
add("三年级上","物质科学","冰融化了",1,"冰吸热温度升到 0°C 开始熔化成水，熔化过程中温度保持 0°C 不变，直到全部化完。","冰块、烧杯、温度计",["冰融化时温度计读数变吗？","怎样让冰化得更快？"],"三态实验台","引导学生对比「熔化」和「融化」：教材用「熔化」。联系生活：化雪时反而更冷——熔化吸热。","");
add("三年级上","物质科学","水能溶解多少物质",0,"食盐能溶解在水里，但不能无限溶解：一定量的水达到「饱和」后，再加盐也不再化，杯底出现沉盐。","烧杯、食盐、小勺、水、玻璃棒",["一直加盐会怎样？","糖和盐谁溶得多？"],"溶解观察器","可以做对比：同样一杯水，糖和盐的溶解量不同。引导学生理解「饱和」概念。","");
add("三年级上","物质科学","加快溶解",0,"搅拌、提高水温、把物质研碎，都能加快溶解——但不改变最终能溶解的量。","烧杯、食盐、玻璃棒、热水冷水",["搅拌能多溶解一些盐吗？","为什么冲糖水用热水快？"],"加速溶解器","控制变量思想启蒙：一次只能变一个条件。可让学生设计对比实验。","");
add("三年级上","物质科学","空气能占据空间吗",1,"把杯子倒扣压入水中，杯内纸巾不湿——空气占据杯内空间，水进不去。","透明杯、纸巾、水槽",["杯子倾斜后会看到什么？","空气看不见，怎么证明它存在？"],"压杯实验","用「不湿的纸巾」作为证据，培养证据意识；可追问如何让水进入杯中。","");
add("三年级上","物质科学","压缩空气（针筒）",1,"堵住针筒口推活塞，空气能被压缩；松手活塞弹回——空气被压缩后想恢复原状，产生弹力。","注射器、橡皮擦（堵口）、水",["为什么空气能压缩，水几乎不能？","皮球为什么能弹起来？","空气被压缩后，颗粒之间的距离变短了"],"压缩空气枪","画颗粒图：压缩前后颗粒数量不变、间距变小。这是本单元核心模型。","");
add("三年级上","物质科学","空气有质量吗",0,"给皮球打足气放天平上，与瘪皮球比较——充气的一侧重，说明空气有质量，只是很轻。","简易天平、皮球、打气筒",["充气前后天平会倾斜吗？","一教室的空气有多重？"],"空气天平","语言要点：说空气「有质量」，不说「没有重量」。可换算一间教室空气约几十千克。","");
add("三年级上","物质科学","做「热气球」",1,"给塑料袋罩住蜡烛火焰加热，袋内空气变热变轻，松手后袋子上飘——热空气上升。","轻塑料袋、蜡烛、铁架（隔离火焰）",["袋子为什么会升起来？","停火后袋子为什么落下来？","热空气上升，冷空气流过来补充"],"热气球升空","严禁学生自行用火；教师演示并盯紧塑料袋别碰到火焰。","用火环节由教师操作，备灭火毛巾");
add("三年级上","物质科学","风的成因",1,"自然界的风就是空气的流动：地面受热不均，热空气上升，冷空气流过来补充，就形成了风。","蜡烛、纸螺旋、门缝观察",["打开教室门一条缝，上沿和下沿的纸条各往哪飘？","海边的风白天从哪边吹来？","热空气上升，冷空气流过来补充"],"风的成因","纸箱风箱演示：箱内点蜡烛，箱侧开小洞，洞口烟雾被吸入——观察空气从冷侧流向热侧。","");
add("三年级上","地球与宇宙","测量降水量（自制雨量器）",0,"雨量器是直筒容器，用雨量杯读数；降水量以毫米计。降雨等级由 24 小时雨量划分。","直筒瓶、漏斗、刻度纸、雨量杯",["为什么喷壶斜着模拟雨不行？","雨量器要放在哪里？"],"雨量器","可模拟降雨：喷壶竖直喷雨在雨量器上方。雨量器应放在开阔、无遮挡处。","");
add("三年级上","地球与宇宙","观察云",0,"云按高度和形状分：积云（棉花堆）、层云（灰幕）、卷云（羽毛）。看云可以识天气：卷云晴，层云可能下雨。","云图卡片、户外观察",["今天天上的云像什么？它预示什么天气？","云实际上是水滴或冰晶"],"看云识天气","拍本地云照片，配上气象谚语（朝霞不出门，晚霞行千里），乡土素材效果好。","");
add("三年级下","技术与工程","物体在斜面上运动",0,"物体在斜面上可能滑动、滚动或静止，取决于形状（球形滚动、方形滑动）和斜面坡度。","斜面板、小球、六棱柱、方木块",["什么形状的物体容易滚动？","怎样让物体从斜面滑得更远？"],"斜面运动","用同一起点释放保证公平——控制变量启蒙。","");
add("三年级下","技术与工程","直线与曲线运动",0,"物体运动的轨迹有直线（苹果落地）也有曲线（投出的球）。","粉笔、小球、绳子",["电梯上升是什么运动？","荡秋千是什么运动？"],"轨迹识别","把粉笔抛出去画出弧线，直观看到曲线轨迹。","");
add("三年级下","技术与工程","比较运动快慢",0,"相同距离比时间（短者快），相同时间比距离（长者快）。速度=距离÷时间。","秒表、小车、卷尺",["百米飞人是怎么比出来的？","乌龟和兔子比什么？"],"比快慢","体育课联动：测全班50米跑成绩，回教室排序分析。","");
add("三年级下","生命科学","养蚕全周期观察",0,"蚕的一生：卵→幼虫（蚕）→蛹（茧）→成虫（蛾），是完全变态发育。持续记录体长、食量、行为。","蚕卵、桑叶、纸盒、放大镜",["蚕蜕皮时有什么表现？","蚕吐丝前有什么信号？","蚕茧里发生了什么？"],"养蚕日记","分发蚕卵让每个孩子领养，做观察日记（配童声记录本）。提前联系桑叶来源。","");
add("三年级下","地球与宇宙","月相变化规律",0,"月相由月球被太阳照亮的部分朝向地球的变化造成，周期约 29.5 天：新月→蛾眉月→上弦月→满月→下弦月→残月。","月相卡片、观察记录表",["上半月和下半月月亮亮面方向一样吗？","十五的月亮一定最圆吗？"],"月相变化","布置连续一个月的家庭观察（家长拍照），乡村地区夜间光污染小，是天然优势。","");
add("四年级上","物质科学","声音是怎样产生的",1,"声音由物体振动产生：敲鼓面看到鼓皮跳动、音叉溅水。振动停止，声音消失。","鼓、音叉、水槽、米粒",["敲鼓时鼓面在动吗？怎么证明？","按住发声的尺子会怎样？","米粒在鼓面跳动"],"声音振动","把米粒撒在鼓面，敲击时米粒跳舞——振动的可视化，是本册最经典演示之一。","");
add("四年级上","物质科学","我们是怎样听到声音的",0,"耳廓收集声波→鼓膜振动→听小骨放大→耳蜗（听觉细胞）→听觉神经→大脑。","耳模型图、纸筒鼓膜模型",["鼓膜在耳朵里起什么作用？","巨大声响时为什么要张嘴捂耳？"],"人耳听声","纸筒+橡皮膜做「鼓膜」模型，对着说话观察米粒跳动——耳朵里也有这样一张「鼓」。","");
add("四年级上","生命科学","测量肺活量",0,"肺活量是一次尽力吸气后再尽力呼出的气体总量。经常锻炼能提高肺活量。","简易肺活量计（袋式）",["运动和肺活量有什么关系？","怎样让肺活量变大？"],"肺活量","分组测量并记录班级数据，比较常运动与少运动同学——用本班数据说话。","");
add("四年级上","生命科学","食物在口腔中的变化",0,"口腔里牙齿切断磨碎食物（物理变化），唾液分解淀粉（化学变化），舌头搅拌混合。","馒头、镜子、碘酒",["干嚼馒头为什么会变甜？","门牙和磨牙形状为什么不同？","淀粉遇碘变蓝"],"食物消化","嚼馒头 5 分钟尝出甜味——唾液把淀粉变成糖。可联动五下的碘酒实验。","");
add("四年级上","技术与工程","运动与摩擦力",1,"一个物体在另一物体表面运动时，接触面产生阻碍运动的力——摩擦力。接触面越粗糙、物体越重，摩擦力越大。","测力计、小车、毛巾、砂纸",["怎样让小车在桌面滑得更远？","旱冰鞋和胶鞋底谁摩擦大？","光滑面摩擦小"],"摩擦力","对比「光滑桌面 / 砂纸 / 毛巾」三种面拉小车读数，学生自己得出接触面粗糙程度的影响。","");
add("四年级下","生命科学","种凤仙花（发芽条件、根吸水、茎运输）",1,"种子发芽需要水分、空气和适宜温度；根吸水，茎通过导管把水往上运输——红水芹菜横切能看到红色导管环。","凤仙花种子、花盆、红墨水、芹菜",["种子没土也能发芽吗？","芹菜变红说明什么？","导管像吸管"],"茎运输","红水芹菜实验：插一下午，横切面出现红色小点排成环——「植物身体里有吸管」，孩子记得住一辈子。","");
add("四年级下","物质科学","简单电路",1,"电池、导线、灯泡（用电器）连成闭合回路；加一个开关可以方便地控制灯亮灭。","电池盒、灯座、开关、导线",["开关断开时电流去哪了？","一节和两节电池，灯亮度一样吗？","闭合回路"],"简单电路","接线顺序：先摆好元件，从电池正极出发连一圈回负极，边连边说「电流走一圈」。","");
add("四年级下","物质科学","导体和绝缘体",1,"容易导电的物体叫导体（金属、铅笔芯、人体、大地、不纯的水）；不容易导电的叫绝缘体（塑料、橡胶、干木头、玻璃）。","电路检测器、待测物品（橡皮、铅笔芯、钥匙、塑料尺）",["铅笔芯是导体还是绝缘体？","绝缘体一定安全吗？","湿木头变导体"],"导体绝缘体","检测铅笔芯会颠覆认知（铅笔芯导电）；强调「人体是导体」，为用电安全铺垫。","不能用检测器测 220V 家用电，安全用电教育必讲");
add("四年级下","地球与宇宙","土壤的成分（沉积实验）",1,"取土块放入水中搅拌静置：浮起枯枝落叶，沉降分层——沙（下）、粉沙（中）、黏土（上），水变浑证明含腐殖质，冒泡证明含空气。","烧杯、当地土壤、玻璃棒",["静置后为什么分层？","土壤里有哪些生命需要的成分？","颗粒大先沉"],"土壤沉积","强调用「校园边/田里的土」而不是买的样本——测自己脚下的土，亲切感完全不同。","");
add("五年级上","物质科学","光的折射（铅笔折断、一条鱼看成两条）",1,"光从空气进入水中传播方向发生偏折——折射。所以斜插水中的铅笔看起来在水面处「折断」，看水里的鱼比实际位置浅。","水杯、铅笔、硬币、碗",["碗底的硬币加水后为什么能看见？","叉鱼要瞄准看到的位置吗？","光在水面拐弯"],"光的折射","「碗底藏硬币」魔术：原来看不见的硬币，倒水后浮现在眼前——先演魔术再揭密，效果拉满。","");
add("五年级上","物质科学","彩色轮合成白光",0,"红绿蓝（或七色）涂在圆盘上快速旋转，颜色混合趋于白色——与色散互为逆过程。","彩色圆盘卡纸、竹签、陀螺",["转起来为什么会发白？","画画调色和光的混合一样吗？"],"色轮合成","光的三原色（红绿蓝）与颜料三原色不同，一句带过即可，不展开。","");
add("五年级上","物质科学","光的反射规律（反射角=入射角）",1,"光碰到物体表面会返回来——反射。反射角等于入射角。镜子反射能力最强。","平面镜、激光笔、量角器纸板",["入射角60度，反射角是多少？","为什么黑布几乎不反光？","反射角=入射角"],"光的反射","激光笔+平面镜+折叠纸板做对照实验（折后半边看不到光路——反射光与入射光同面），并用量角器量两角。","激光笔严禁照射人眼，演示前宣布纪律");
add("五年级上","物质科学","制作潜望镜",1,"两块平面镜与水平成45°平行放置：上面镜子把水平光反射向下，下面镜子再反射成水平进入眼睛——潜艇不用露头就能看海面。","纸盒、两块平面镜、剪刀、量角器",["两块镜子要怎么摆？","万花筒和潜望镜像不像？","两面45°镜"],"潜望镜","做出来去窗台下「偷看」窗外：成功的瞬间就是「哇」时刻。镜片易碎，提前贴好透明胶边。","镜片边缘贴胶防割手");
add("五年级上","地球与宇宙","地震成因模拟（小盒泥土挤压/拉伸）",1,"小盒装泥土，从两端挤压：泥土隆起褶皱；拉开：出现裂缝——地壳板块挤压拉伸使岩层变形断裂，能量释放形成地震。","薄木片/纸盒、湿泥土/多层海绵毛巾",["挤压时泥土发生了什么？","地震能预报吗？","板块挤压→变形→断裂"],"地震模拟","教室内桌下避震演练顺势完成：护头、躲在桌旁生命三角区、有序撤离。","");
add("五年级上","地球与宇宙","火山喷发模拟（土豆泥+番茄酱加热）",1,"土豆泥做山体，埋一勺番茄酱，加热：番茄酱（岩浆）受热膨胀、气体顶开山体喷出——地壳薄弱处岩浆喷发形成火山。","酒精灯、土豆泥、番茄酱、坩埚/金属盖",["岩浆为什么会喷出来？","火山只有坏处吗？","加热→膨胀→喷发"],"火山喷发","番茄酱不要装太满，加热时人保持距离；岩浆冷却后问「这像什么」——引出火山岩。","加热实验由教师操作，学生隔位观察");
add("五年级上","地球与宇宙","风的作用",0,"风裹挟沙粒吹打岩石，日久磨出风蚀地貌（蘑菇石、风蚀城堡）；风还能搬运堆积沙丘。","砂纸、肥皂块/粉笔、风扇、沙盘",["蘑菇石为什么上大下小？","沙漠的沙丘是怎么移动的？"],"风蚀模拟","用吹气+沙击肥皂块模拟风蚀；课前搜几张敦煌雅丹地貌照片，离安徽近、孩子可能听过。","");
add("五年级上","技术与工程","水流速度与水位关系（水钟）",1,"容器水位越高，底部小孔水流越快；水位下降，水流变慢——漏水不均匀，所以要设计「受水型/泄水型」水钟补偿。","水瓶、锥子、秒表、刻度杯",["水位下降，滴水会越来越慢吗？","怎样让水滴得均匀一点？","水位高→流得快"],"水钟","先让学生猜想「每10秒滴的水一样多吗」，再实测打脸——发现规律比被告知规律深刻十倍。","");
add("五年级上","技术与工程","摆的等时性",1,"同一个摆，摆动幅度变小，但每摆一次（一个来回）的时间基本不变——摆具有等时性，伽利略由此启发后人造出钟摆。","摆架（线+重物）、秒表、量角器",["摆幅变小了，摆一次的时间变吗？","连续数10个来回和1个来回时间一样吗？","同一个摆，来回时间几乎不变"],"单摆实验","先猜「摆幅小了会变慢吗」再数10次摆动计时——推翻直觉的实验最有冲击力。","");
add("五年级下","生命科学","生态瓶（池塘模型）",1,"瓶中水草（产氧）+小鱼/螺+塘泥+水形成小型生态系统：水草光合供氧，鱼吃食产二氧化碳，微生物分解——物质循环、相互依存。","透明瓶、池塘水、水草、小鱼/螺、沙泥",["为什么不能放太多鱼？","生态瓶多久换一次水？","平衡=相互依存"],"生态瓶","关键提醒：鱼1-2条、水草适量、不喂食或极少喂——「贪多必崩」正好讲生态承载力。","");
add("五年级下","技术与工程","船的载重量",1,"相同材料的船，体积（排水量）越大载重越大；船舷加高能多载但太高易翻——结构强度与稳定性的权衡。","正方形铝箔/卡纸、水槽、垫圈",["大船和小船谁载得多？","船舷越高越好吗？","体积大→浮力大"],"浮沉实验","统一材料（同尺寸铝箔）折不同体积的船，测载重——控制变量思想贯穿。","");
add("五年级下","技术与工程","设计动力小船",0,"给船加动力：橡皮筋+桨（弹力）、气球（反冲）、电动风扇（电能→风能），综合设计制作测试。","船体材料、动力装置、水槽",["哪种动力跑得远？","怎样保持船走直线？"],"动力小船","水池测试+录像回放分析，比现场更看清谁的船最稳。","");
add("五年级下","物质科学","热对流（木屑轨迹）",1,"烧杯水撒木屑/茶叶加热：底部水受热上升、表面冷水下降，木屑画出环流圈——对流靠液体/气体的流动传热。","烧杯、木屑、酒精灯",["木屑为什么转圈走？","暖气片为什么装在房间下方？","热升冷降循环"],"热对流","提前用手机拍好木屑环流的特写视频，配合实物演示双保险；可讲「烧开水时锅里的水在翻圈」。","");
add("五年级下","物质科学","热辐射",0,"热可以不靠介质直接以「辐射」传出去：太阳隔着真空晒热地球，站在火堆旁脸会热——辐射沿直线，遇到物体会被吸收。","台灯（白炽）、手、温度计",["隔着空气脸为什么热？","太阳的热怎么穿过真空？","不需介质，直线传递"],"热辐射","手靠近白炽灯感受热但不接触；强调辐射、对流、传导三种方式的辨析。","灯泡烫手，勿触碰");
add("六年级上","物质科学","自制简易显微镜（两个凸透镜）",1,"两个放大镜上下叠合：下方物镜放大一次，上方目镜再放大——上下移动调节距离，能看到更微小的物体。","两个放大镜、纸筒、胶带",["一个放大镜和两个叠加，哪个看得更清楚？","显微镜为什么要两个镜片？","两级放大"],"简易显微镜","用纸筒固定两片放大镜，对准书上的小句号——看到放大的圆形光斑结构，显微镜原理就懂了。","");
add("六年级上","生命科学","观察洋葱表皮细胞",1,"洋葱鳞叶内表皮撕一小片，碘酒染色，显微镜下看到排列整齐的长方形细胞：细胞壁、细胞核、液泡。","洋葱、镊子、碘酒、载玻片、显微镜",["细胞是什么形状？为什么排列这么整齐？","为什么染色后看得更清楚？","动植物都由细胞构成"],"洋葱细胞","撕内表皮技巧：用刀尖在洋葱内面划小格，镊子夹一角轻撕——示范两次再放手。","洋葱刺激眼睛注意通风；碘酒勿入口");
add("六年级上","生命科学","观察口腔上皮细胞",0,"牙签轻刮口腔内侧黏膜，涂抹在载玻片上染色——人的细胞没有细胞壁，只有细胞膜，呈不规则扁平状。","牙签、碘酒/亚甲基蓝、显微镜",["人的细胞和洋葱细胞有什么不同？","为什么人的细胞没有细胞壁？","植物有壁，动物没有"],"口腔细胞","对比观察是重点：画两种细胞图，让学生圈出「只有植物有的结构」。牙签用消毒过的，每人一份。","牙签轻刮即可，勿戳伤口腔");
add("六年级上","生命科学","观察水中微小生物",0,"池塘水/稻根水滴在载玻片上，低倍镜下能看到草履虫、变形虫、轮虫等微生物——一滴水就是一个动物园。","池塘水（稻根处取水最佳）、显微镜、脱脂棉",["一滴水里有生命吗？","草履虫像什么鞋？","微生物无处不在"],"微生物","取水样就地取材：学校附近水沟、稻田里的水最好用——「我们村水里的生物」自带亲切感。","");
add("六年级上","地球与宇宙","昼夜交替模拟（手电筒+地球仪）",1,"手电筒当太阳照地球仪：照亮的一半是昼，背光一半是夜；转动地球仪，同一地点经历昼夜交替——地球自转产生昼夜。","地球仪、手电筒、贴纸小人",["贴在合肥位置的小人，转到哪边是白天？","不自转会怎样？","自转→昼夜交替"],"昼夜交替","在地球仪上贴红色小人「代表我们」，转一圈数一数他经历几次昼夜。中国位置贴纸越具体越有代入感。","");
add("六年级上","地球与宇宙","四季成因模拟（地轴倾斜）",1,"地球倾斜着身子（地轴倾斜约23.5°）绕太阳转：夏至太阳直射北半球，光集中、昼长；冬至斜射，光分散、昼短——地轴倾斜+公转产生四季。","地球仪、手电筒、暗室",["如果地轴不倾斜，还有四季吗？","夏天和冬天，太阳照我们的角度有什么不同？","直射热，斜射凉"],"四季成因","手电筒直射与斜射同一块纸板，比较光斑亮度大小——「直射亮斑小而强、斜射亮斑大而弱」是四季的钥匙。","");
add("六年级上","物质科学","电磁铁（线圈吸大头针）",1,"线圈绕在铁钉上通电，铁钉能吸起大头针；断电磁性消失——电能转换为磁能。圈数越多、电流越大，磁力越强。","大铁钉、漆包线、电池、大头针、开关",["通电和断电有什么区别？","绕几圈能吸几枚？","电生磁"],"电磁铁","让每组比赛「谁的电磁铁吸得多」，比赛结束自然引出两个变量：圈数、电池节数。","通电时间要短，防止线圈和电池过热");
add("六年级上","技术与工程","小电动机",0,"电动机：电能→机械能。磁铁+线圈通电受力转动；小马达里拆开能看到磁铁、线圈、换向器。","小电动机（玩具马达）、电池、扇叶",["电动机里藏着什么？","电动车和燃油车动力有什么不同？","电→磁→转动"],"小电动机","拆旧玩具马达最有趣：一圈线圈、两块磁铁、三个铜片——「电动玩具的心脏」就长这样。","拆装时注意小零件勿入口");
add("六年级上","技术与工程","能量转换（搓手发热、荡秋千）",0,"能量可以从一种形式转换为另一种形式：搓手（动能→热能）、荡秋千（动能⇄势能）、电风扇（电能→机械能）、植物（光能→化学能）。","玩具、图片",["搓手时能量怎么变？","过山车的能量在怎么变？","一种能变另一种能"],"能量转换","画「能量转换链」：太阳→水稻→米饭→我写字，一条链把光能、化学能、动能全串起来。","");
add("六年级下","生命科学","校园生物大搜索与分类",0,"分组分区调查校园（或村口、田边）的动植物，记录名称数量；按一定标准分类（会飞/会爬、草本/木本）。","放大镜、记录表、图鉴",["我们校园里住着多少种生物？","为什么要给生物分类？"],"校园生物","把校园换成「上学路」更乡土：一段田埂上的生物多样性调查，配童声记录本做记录。","");
add("六年级下","物质科学","铁生锈的条件",1,"铁在有水和空气（氧气）共同作用下生锈：干燥空气中的铁钉、完全浸没煮沸除氧水的铁钉都不易生锈；水和空气都有的才生锈。","铁钉、试管、水、干燥剂、油",["哪支试管的铁钉先锈？","不锈钢为什么不生锈？","水+空气=生锈"],"铁钉生锈","三管对比需提前一周准备！这是全册唯一长周期实验，支教出发前就要布置。铁锈勿入口，观察后洗手。","提前一周布置实验；铁锈勿入口，观察后洗手");
add("六年级下","物质科学","小苏打与白醋（产生气体）",1,"小苏打和白醋混合产生大量气泡（二氧化碳气体）：气体使点燃的木条熄灭、使澄清石灰水变浑浊——生成了新物质，属于化学变化。","小苏打、白醋、木条、石灰水",["气体把火苗怎么了？","这个气体是什么？","CO₂不支持燃烧"],"酸碱反应","倒「看不见的气体」熄灭阶梯蜡烛（下层先灭）——像倒液体一样倒气体，全场安静的那一刻值回票价。","蜡烛明火注意防火");
add("六年级下","地球与宇宙","观察星空与星座",0,"认识北斗七星、北极星（沿勺口两星连线延长约5倍找到）、夏季大三角。星图按季节使用；农村夜空光污染小，观星条件天然好。","活动星图、手电（蒙红布）",["北斗七星的勺柄四季指向会变吗？","怎么找到北极星？","北极星基本不动"],"星空导航","布置家庭观星作业：连续三晚同位置看北斗七星并画下来；结合「村里晚上能看见星星吗」的童声记录。","夜间观星需家长陪同，手电蒙红布护夜视");
add("六年级下","地球与宇宙","日食月食模拟",0,"三球模拟：月球转到太阳和地球之间（农历初一）可能挡住太阳光形成日食；地球转到太阳和月球之间（农历十五）影子落在月球上形成月食。","三球仪/手电筒+大小球",["日食时谁在中间？月食时呢？","为什么不是每月都有日食月食？","三点一线+轨道有夹角"],"日食月食","推荐搭配教具库《01-日食与月食》交互页面：拖动月球实时看到地球视角，两者配合使用。","");
add("拓展实验","地球与宇宙","水循环模拟（热水+保鲜膜+冰块）",1,"碗装热水（蒸发），覆保鲜膜，膜上放冰块（遇冷凝结），膜下水珠聚多落下（降水）——完整演示蒸发→凝结→降水的水循环。","碗、热水、保鲜膜、冰块、小石子",["膜上的水珠是哪来的？","大自然中谁是那个『冰块』？","蒸发→凝结→降水"],"水循环","5分钟就能看到膜上挂满水珠，滴答「下雨」——把整个大气层搬进一只碗。","热水由教师倒取，防烫");
add("拓展实验","地球与宇宙","龙卷风瓶（两瓶对接旋转）",0,"两个水瓶对接，装水的在上，旋转摇晃：水中出现漏斗状漩涡，快速下流——旋转加速排水，模拟龙卷风的涡旋结构。","两个塑料瓶、连接口（瓶盖对接）",["为什么要转起来才流得快？","龙卷风和这个像吗？","涡旋"],"水涡演示","先把两瓶对接不摇晃（滴滴答答），再摇晃（唰地流完）——对比让学生自己发现「旋转改变了水流」。","");
add("拓展实验","地球与宇宙","岩石风化（热胀冷缩冻融）",0,"岩石白天晒热膨胀、夜晚冷却收缩，长期反复产生裂隙；水进裂缝结冰膨胀再撑大裂缝——岩石最终碎裂成碎石土壤。","岩石块、酒精灯、冷水、镊子",["岩石也怕「忽冷忽热」？","山脚的碎石是哪来的？","反复胀缩→裂开"],"岩石风化","把烧烫的石头骤然浸入冷水（教师操作），「咔」的一声裂开——岩石也会「感冒」。","热石浸水可能迸溅，学生保持距离，教师戴护目镜");
add("拓展实验","地球与宇宙","火山喷发（小苏打+白醋+红色素）",1,"小苏打（碱性）与白醋（酸性）反应产生二氧化碳，红色泡沫涌出「火山口」——模拟岩浆喷出的现象（真实火山是岩浆，机理不同需说明）。","小苏打、白醋、红色素、洗洁精、黏土锥体",["泡沫为什么会涌出来？","真火山的岩浆是被什么推出来的？","产气推挤"],"火山喷发","加几滴洗洁精让泡沫更持久；先讲真实机理（气体压力+岩浆），再说明这只是「现象模拟」。","小苏打白醋无害，但注意别溅入眼睛");
add("拓展实验","地球与宇宙","地球仪看昼夜与四季",0,"用地球仪+强光源演示：自转→昼夜交替；倾斜+公转→四季变化与极昼极夜——把六上两课合并成一台「大戏」。","地球仪、强光手电",["影子实验里学过的，地球仪上也成立吗？","极昼极夜发生在哪里？","昼夜交替"],"四季成因","与六年级上「昼夜交替」「四季成因」两个实验配合使用，作为综合复习版。","");
add("拓展实验","地球与宇宙","自制「雨」（瓶中云）",0,"玻璃杯热水上放一层泡沫（云），冰块压在上面：水汽上升遇冷在泡沫下凝结成水滴，落下成「雨」——云和雨的形成原理。","玻璃杯、热水、泡沫/海绵、冰块",["云摸起来是什么感觉？","雨滴在哪里出生？","水汽遇冷成云滴"],"水循环","与水循环模拟二选一即可，原理相同、装置不同；本版更mini，适合小组做。","热水由教师倒取，防烫");
add("拓展实验","生命科学","光合作用产氧（水草冒泡）",1,"金鱼藻/黑藻放在水中，用灯光照射或阳光直射：叶片冒出气泡（氧气）——光下植物光合作用产生氧气。","金鱼藻、烧杯、水、台灯",["气泡是从哪里冒出来的？","鱼缸为什么要放水草？","光+植物→氧气"],"光合作用","把气泡收集到小试管里，用带火星的木条复燃检验氧气（教师演示）——「植物在给我们造空气」。","木条复燃实验由教师演示");
add("拓展实验","生命科学","植物向光性",0,"纸盒一侧开孔，豆苗放盒内：几天后苗弯向孔的方向生长——植物对光有反应（向光性），为了争取更多阳光。","纸盒、豆苗（提前一周种）",["苗为什么「拐弯」了？","窗台的花为什么朝外长？","向着光长"],"向光性","「拐弯的苗」让孩子看到植物会「做决定」；可以让孩子给苗画「成长漫画」。","");
add("拓展实验","生命科学","白色花插色素水变色",1,"白花（白菊/康乃馨）插进色素水中，一天后花瓣边缘出现颜色——茎里的导管把水送到花瓣（蒸腾拉力+毛细作用）。","白花、色素、杯子",["红色是怎么爬上去的？","和红水芹菜实验是不是一个道理？","导管运输"],"茎运输","和四下「茎运输」呼应；彩蛋：把花茎竖着劈成两半分别插不同颜色，得一朵双色花。","");
add("拓展实验","生命科学","酵母菌发酵（面团/瓶口套气球）",1,"酵母+糖+温水，瓶口套气球：酵母「吃糖产气」，气球被吹起——微生物发酵产生二氧化碳，馒头面包松软的秘密。","酵母、糖、温水、塑料瓶、气球",["气球是谁吹起来的？","馒头里的孔是哪来的？","微生物吃糖产气"],"酵母发酵","摸一摸发好的面团「软乎乎像棉花」；有条件现场蒸一个馒头剖面观察气孔。","");
add("拓展实验","生命科学","观察鸡蛋结构",0,"生鸡蛋打开：蛋壳（上有气孔）、壳膜、蛋清（卵白）、蛋黄（卵黄，供胚胎营养）、系带、胚盘——一个鸡蛋就是一个「营养仓」。","鸡蛋、碗、放大镜",["蛋壳上能找到气孔吗？","蛋黄上的小点是做什么的？","卵黄=营养库"],"鸡蛋结构","熟蛋纵切+生蛋打开对照看；气孔实验：把蛋浸入温热的水中，壳表面冒出小气泡。","");
add("拓展实验","生命科学","指纹采集观察",0,"手指按在铅笔粉上再贴透明胶带，指纹转移到胶带上——指纹是独一无二的（斗形、箕形、弓形），公安靠它破案。","铅笔、透明胶带、白纸、放大镜",["你的指纹和同桌的一样吗？","双胞胎指纹一样吗？","三种纹型"],"指纹观察","「小小神探」环节：现场取三枚指纹，找出「罪犯」是谁按的——分类+匹配的游戏化课堂。","");
add("拓展实验","生命科学","面包发霉对比（洗手vs不洗手摸面包）",1,"两片面包：一片用没洗的手摸，一片用刚洗的手摸，分别装袋封口放几天——脏手那片先长霉：洗手能大幅减少手上的霉菌孢子。","面包、密封袋、标签、放大镜",["哪片面包先发霉？","霉从哪里来？","霉菌孢子无处不在"],"面包发霉","这是一堂「看得见的卫生课」：霉斑照片对比放进班级卫生角，比喊一百遍「去洗手」管用。","发霉面包观察后密封丢弃，勿开袋");
add("拓展实验","物质科学","静电系列（气球吸发、隔空吸纸屑、胡椒粉与盐分离）",1,"摩擦过的气球带静电，能吸起头发、纸屑；胡椒粉比盐轻，先被吸起——静电能吸引轻小物体。","气球、碎纸屑、胡椒粉、盐、干布",["气球为什么能吸头发？","怎么让胡椒粉和盐分开？","摩擦起电吸轻物"],"静电实验","冬天效果最好（干燥）；「胡椒粉先跳起来」的瞬间就是分类完成的瞬间。","");
add("拓展实验","物质科学","水的表面张力（回形针浮水面、硬币上滴水、胡椒粉「逃跑」）",1,"水面的水分子互相「拉着手」，形成一层绷紧的膜——回形针密度比水大却能浮在水面；硬币上能堆几十滴水鼓成小包；滴洗洁精后张力被破坏，膜上的胡椒粉瞬间散开。","回形针、硬币、滴管、水盘、胡椒粉、洗洁精",["钢做的回形针为什么会浮？","洗洁精一滴，胡椒粉为什么逃？","水面有一层看不见的膜"],"表面张力","「滴洗洁精赶跑胡椒粉」是全场尖叫时刻；回形针要平放轻放，失败几次正说明张力微妙。","");
add("拓展实验","物质科学","浮沉子",1,"笔帽/小瓶做成的浮沉子：捏瓶，水压进浮沉子使其变重下沉；松手变轻上浮——通过改变自身重来控制沉浮，潜水艇的原理。","塑料瓶、笔帽/小药瓶、水、橡皮泥",["捏瓶子时浮沉子里发生了什么？","潜水艇是怎么上浮下潜的？","改变自重控制沉浮"],"浮沉实验","调试是关键：浮沉子调到「刚好浮在水面露一点点头」最灵敏。每人一瓶带回玩。","");
add("拓展实验","物质科学","非牛顿流体（玉米淀粉水）",1,"玉米淀粉加水：慢慢插手指能进去，快速捶打却硬邦邦——受力越快越像固体（剪切增稠），「遇强则强」。","玉米淀粉、水、盆",["为什么打不进去却能慢慢沉下去？","沼泽地和它像吗？","快速受力变硬"],"非牛顿流体","「水上漂」挑战：盆里快速拍打不粘手；配一脚踩进去拔不出来的沼泽故事，安全提醒必讲。","盆底滑，站稳再玩；玩完洗手");
add("拓展实验","物质科学","伯努利（吹不开的纸条、机翼升力）",0,"气流快的地方压强小：向两张纸中间吹气，纸反而靠拢；机翼上表面弧形气流快压强小，下表面压强大——飞机被「托」起来。","两张纸条、吸管、纸机翼模型",["往两张纸中间吹气，纸会分开吗？","飞机这么重为什么能飞？","流速大压强小"],"伯努利","先猜「吹气纸会分开」，结果纸靠拢——预测落空才记得牢。","");
add("拓展实验","物质科学","惯性体验",0,"物体保持原来运动状态的性质叫惯性：急刹车身体前倾、甩体温计、拍打衣服除灰、跑步冲线停不下来。","小车、木块、硬币、杯子卡片",["急刹车人为什么前倾？","怎样把硬币弹进杯子？","运动物体想保持运动"],"惯性","卡片弹硬币入杯：手指弹卡片，硬币因惯性留在原处落进杯里——一发命中全场鼓掌。","");
add("拓展实验","物质科学","杠杆与天平",0,"杠杆平衡：动力×动力臂=阻力×阻力臂。支点、力臂概念。撬棍省力、跷跷板游戏都是杠杆。","直尺、橡皮（支点）、硬币、天平",["大人小孩怎么玩跷跷板才平？","为什么撬棍能撬动大石头？","力臂长省力"],"杠杆天平","「小孩翘起大人」：调整坐位离支点距离——教室里用直尺+橡皮+硬币人人可试。","");
add("拓展实验","物质科学","紫甘蓝汁酸碱指示剂",1,"紫甘蓝汁遇到酸性变红、遇碱性变绿蓝——是天然的酸碱指示剂：白醋变红、小苏打水变绿，自制「彩虹药水」。","紫甘蓝、热水、白醋、小苏打、透明杯",["为什么同一杯汁会变不同颜色？","柠檬水和肥皂水谁会变红？","遇酸变红，遇碱变绿"],"酸碱指示剂","紫甘蓝撕碎用热水泡出蓝紫色汁；让孩子把家里的液体（醋、碱水、雪碧）都来测一测。","");
add("拓展实验","物质科学","柠檬酸+小苏打「火箭」",1,"柠檬酸与小苏打反应产生大量二氧化碳，瓶内气压猛增把「火箭」（软木塞/瓶盖）顶飞——气体压力做功，反冲起飞。","塑料瓶、柠檬酸、小苏打、软木塞、水",["是什么把火箭顶出去的？","加多少料飞得最高？","产气→增压→发射"],"酸碱反应","瓶口朝上发射、人脸勿凑近；先小剂量试飞再让学生控制变量（药量、水量）。","发射时瓶口勿对人，保持2米距离");
add("拓展实验","物质科学","碘伏检测食物淀粉",0,"碘伏（或碘酒）遇淀粉变蓝紫色：米饭、面包、土豆变蓝，蔬菜大多不变——快速「验出」食物里的能量物质。","碘伏、各类食物切片",["哪些食物变蓝了？","不含淀粉的食物提供什么？","淀粉+碘→蓝紫色"],"淀粉检测","与六下「米饭淀粉遇碘变蓝」同一原理，可作为前置或家庭版。","碘伏勿入口，实验后洗手");
add("拓展实验","物质科学","蜡烛燃烧使石灰水变浑浊",0,"蜡烛燃烧产生二氧化碳：把气体导入澄清石灰水，石灰水变浑浊——证明燃烧生成了新物质（二氧化碳）。","蜡烛、石灰水、导管/吸管、瓶子",["石灰水为什么变浑了？","我们呼出的气有二氧化碳吗？","CO₂+石灰水→浑浊"],"物质变化","对着石灰水吹气也变浑——人呼出的也有二氧化碳；两课联动（六下蜡烛燃烧）。","蜡烛与石灰水勿入口，防火");
add("拓展实验","物质科学","蛋壳遇醋冒泡（碳酸钙）",0,"蛋壳主要成分碳酸钙，与醋酸反应产生二氧化碳气泡，蛋壳渐渐变软——「软壳蛋」：酸与碳酸盐反应。","鸡蛋壳、白醋、杯子",["气泡是什么气体？","泡过的蛋壳怎么了？","碳酸钙+醋→冒泡"],"蛋壳遇醋","泡一夜变「软壳蛋」（其实内膜露出）；引申：醋除水垢是同一原理，厨房里的化学。","");
add("拓展实验","物质科学","柠檬汁隐形墨水",0,"柠檬汁写字晾干后看不见，加热（灯泡烤/熨斗）字迹碳化变棕显形——柠檬汁里的有机物受热变色。","柠檬、棉签、白纸、灯泡/熨斗",["为什么加热后字出现了？","还有哪些汁能当墨水？","受热碳化显色"],"隐形墨水","写「密信」传给同桌，教师统一烤显——科学课+游戏课。","熨斗/灯泡加热由教师操作，防烫防火");
add("拓展实验","物质科学","铁钉生锈条件对比",0,"三支试管：干燥空气、煮沸除氧的水、普通水——只有同时接触水和空气的铁钉生锈。铁锈是新物质（氧化铁）。","铁钉、试管、干燥剂、食用油、水",["哪支试管的铁钉锈了？","刷漆的铁为什么不易锈？","水+空气=生锈"],"铁钉生锈","与六下课本实验同款，可作为提前一周布置的家庭版。","铁锈勿入口，观察后洗手");
add("生活常识","水的奥秘","冬天窗户上的水珠从哪来",0,"冬天室内暖湿空气遇到冷玻璃，水蒸气凝结成小水珠（在内侧）；夏天冰饮料瓶外壁的水珠来自室外空气（在外侧）——都是凝结。","镜子/玻璃、冰饮料",["冬天的水珠在玻璃哪一面？夏天的呢？","是谁把水「贴」上去的？","暖湿气遇冷凝结"],"凝结观察","好问题胜过好讲解：先让孩子摸两面再讨论——发现「两面都有可能」就懂了凝结的本质。","");
add("生活常识","物质科学","冰块加盐更冷（冰激凌制作）",0,"冰融化要吸热，盐让冰的熔点降低加速融化、大量吸热——冰盐混合物可达约 −10°C，足以把牛奶冻成冰激凌。","碎冰、食盐、牛奶、小袋、手套",["冰里加盐为什么反而更冷？","化雪后为什么更冷？","融化吸热降温"],"冰盐实验","摇冰激凌10分钟人人有份——「科学是甜的」；同机理：三上「水结冰了」冰盐制冷、冬天撒盐融雪。","低温冰别直接徒手长时间握持");
add("生活常识","水的奥秘","过滤净化脏水",0,"用石子、沙、棉布、活性炭层层过滤脏水：大颗粒被挡住、炭吸附色素异味——得到澄清的水但≠能喝（微生物还在，需煮沸）。","塑料瓶、纱布、沙、小石子、活性炭、脏水",["过滤后的水能直接喝吗？","每一层各拦住了什么？","层层拦截"],"水的净化","必须讲清「变清≠变干净」：过滤后仍需煮沸杀菌；联动野外生存知识。","过滤后的水不可饮用");
add("生活常识","物质科学","肥皂去污与洗手实验",0,"肥皂分子一端亲水一端亲油：油污被「包」进水里冲走。对比只用清水和用肥皂洗手（摸面包发霉验证）：肥皂+20秒搓洗最干净。","肥皂、油、水、胡椒粉盘",["清水为什么洗不掉油？","洗手要洗多久才够？","亲油端包油污"],"去污原理","「手上抹油再洗」对比实验直观有效；配七步洗手法口诀。","");
add("生活常识","物质科学","微波炉加热原理",0,"微波炉发出微波让食物中的水分子快速来回转动「摩擦」生热——从食物内部直接加热；所以含水量高的食物热得快，金属会反射微波不能用。","微波炉（观察讲解）、一杯水",["为什么鸡蛋放微波炉会炸？","为什么金属器皿不能放？","水分子摩擦生热"],"微波加热","安全教育课：微波炉禁放鸡蛋（炸）、金属（火花）、密封容器（喷）；先讲规则再讲原理。","严禁自行操作微波炉加热鸡蛋、金属、密封食品");
add("生活常识","物质科学","为什么高压锅熟得快",0,"气压越高水的沸点越高：高压锅内约2个大气压，水沸点升至约120°C，温度更高食物熟得更快——气压与沸点的关系。","高压锅（讲解观察）、水的沸点表",["高压锅里的水「开」得更高温吗？","高原上煮饭为什么煮不熟？","气压高→沸点高"],"沸点气压","反例讲高原：气压低沸点低，鸡蛋煮不熟——引出高原用高压锅的必要性。","");
add("水的奥秘","水的奥秘","水的三态变化循环",1,"水在 0°C 和 100°C 两个关口变形态：冰⇌水（熔化/凝固）、水⇌水蒸气（蒸发沸腾/凝结）——拖动温度，看分子从「手拉手排队」到「自由乱飞」。","（互动演示版，无需器材）",["冰化成水和水冻成冰，温度各是多少？","水蒸气看得见吗？","0°C 熔化凝固，100°C 沸腾"],"三态实验台","本演示可直接投影使用，配合教具库《02-水的三态变化》完整版效果更佳。","");
add("水的奥秘","水的奥秘","表面张力",1,"水分子在表面互相牵引形成「弹性膜」：水黾在水面上滑行、叶子上的水珠成球、硬币能托起几十滴水——都是表面张力。","硬币、滴管、水、盆",["水黾为什么不沉？","水珠为什么是圆的？","表面分子互相拉"],"表面张力","与拓展「水的表面张力」同款，此处作为水的专题入口。","");
add("水的奥秘","水的奥秘","浮力与密度（橡皮泥船）",1,"同样一块橡皮泥：团成球沉底，捏成船形能源浮还能装「货」——形状改变排水量，排水量越大浮力越大。选形状、加硬币试试。","（互动演示版）橡皮泥、水盆、硬币",["为什么同一块泥能沉也能浮？","什么形状装得最多？","空心排开更多水"],"浮沉实验","先猜后试：团球必沉、船形能载——「沉浮由形状决定」这一认知颠覆就在点击之间。","");
add("水的奥秘","水的奥秘","光的折射（筷子折断）",1,"光从空气进入水中传播方向偏折：斜插水中的筷子在水面处「折断」、水里的鱼看起来比实际浅——拖动入射角看看光怎么拐弯。","（互动演示版）水杯、筷子、硬币",["筷子真的断了吗？","看到的鱼在哪里？实际在哪里？","光在水面拐弯"],"光的折射","投影演示后必做实物版：碗底硬币倒水「浮现」——虚拟+现实各一遍，理解最牢。","");
add("水的奥秘","水的奥秘","水的净化（过滤→蒸馏）",1,"净化水的两步：过滤除去不溶杂质（变清），蒸馏分离溶解物质（水蒸气冷凝成纯净水）——蒸馏水就是这么来的。","烧瓶、冷凝管/管子、凉水杯",["过滤和蒸馏各去掉什么？","海水淡化用哪一步？","过滤去杂质，蒸馏去盐分"],"水的净化","蒸馏演示需加热，教师操作；讲「 sailors 海水淡化」故事连接地球水循环。","加热蒸馏由教师操作，防烫");

D("三态实验台","水的三态实验台","拖动温度，看看水分子们在做什么",
function(p){return '<canvas id="'+p+'cv" width="640" height="230" style="background:#0E1631;border-radius:10px;width:100%;display:block"></canvas>'
+'<div style="display:flex;gap:10px;align-items:center;margin-top:10px"><span>−20°C</span><input type="range" id="'+p+'t" min="-20" max="120" value="20" style="flex:1"><span>120°C</span><span id="'+p+'l" style="width:64px;font-weight:bold;color:#B7791F">20°C</span></div>'
+'<div id="'+p+'st" style="margin-top:8px;font-size:14px;line-height:1.8"></div>';},
function(p){
var cv=document.getElementById(p+'cv'),ctx=cv.getContext('2d');
var parts=[],i,cols=6,N=24;
for(i=0;i<N;i++){parts.push({x:260+(i%cols)*34+17,y:60+Math.floor(i/cols)*28,vx:0,vy:0,sx:260+(i%cols)*34+17,sy:60+Math.floor(i/cols)*28});}
var temp=20;
function mode(){return temp<0?0:(temp<100?1:2);}
function loop(){
if(!document.getElementById(p+'cv'))return;
var m=mode(),j,q,d,dx,dy,ov,nx,ny;
for(i=0;i<N;i++)for(j=i+1;j<N;j++){
dx=parts[j].x-parts[i].x;dy=parts[j].y-parts[i].y;d=Math.sqrt(dx*dx+dy*dy);
if(d>0&&d<18){ov=(18-d)*0.2;nx=dx/d;ny=dy/d;parts[i].x-=nx*ov;parts[i].y-=ny*ov;parts[j].x+=nx*ov;parts[j].y+=ny*ov;}}
for(i=0;i<N;i++){var a=parts[i];
if(m==0){a.vx+=(a.sx-a.x)*0.05;a.vy+=(a.sy-a.y)*0.05;a.vx+=(Math.random()-0.5)*0.3;a.vy+=(Math.random()-0.5)*0.3;a.vx*=0.85;a.vy*=0.85;}
else if(m==1){a.vy+=0.08;a.vx+=(Math.random()-0.5)*0.2;a.vx*=0.97;a.vy*=0.97;if(a.x<250)a.vx+=0.1;if(a.x>480)a.vx-=0.1;if(a.y>200)a.vy=-Math.abs(a.vy)*0.4;}
else{a.vx+=(Math.random()-0.5)*0.5;a.vy+=(Math.random()-0.5)*0.5;var sp=Math.sqrt(a.vx*a.vx+a.vy*a.vy);if(sp<1.2){a.vx+=(Math.random()-0.5);a.vy+=(Math.random()-0.5);}if(sp>4.5){a.vx*=0.9;a.vy*=0.9;}
if(a.x<8){a.x=8;a.vx=Math.abs(a.vx);}if(a.x>632){a.x=632;a.vx=-Math.abs(a.vx);}if(a.y<8){a.y=8;a.vy=Math.abs(a.vy);}if(a.y>222){a.y=222;a.vy=-Math.abs(a.vy);}}
a.x+=a.vx;a.y+=a.vy;
if(m!=2){if(a.x<245){a.x=245;a.vx=Math.abs(a.vx);}if(a.x>485){a.x=485;a.vx=-Math.abs(a.vx);}if(a.y<14){a.y=14;a.vy=Math.abs(a.vy);}if(a.y>200){a.y=200;a.vy=-Math.abs(a.vy);}}}
ctx.fillStyle='#0E1631';ctx.fillRect(0,0,640,230);
if(m!=2){ctx.strokeStyle='#3B4A7E';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(238,8);ctx.lineTo(238,208);ctx.lineTo(492,208);ctx.lineTo(492,8);ctx.stroke();}
else{ctx.fillStyle='rgba(95,169,255,.08)';ctx.fillRect(0,0,640,230);}
ctx.fillStyle=m==0?'#BFE3FF':'#6FB7FF';
for(i=0;i<N;i++){ctx.beginPath();ctx.arc(parts[i].x,parts[i].y,8,0,Math.PI*2);ctx.fill();}
ctx.fillStyle='#E8ECF6';ctx.font='bold 14px sans-serif';
var names=['固态（冰）：分子排队，原地振动','液态（水）：分子牵手，可以滑动','气态（水蒸气）：分子自由乱飞'];
ctx.fillText(names[m],14,22);
requestAnimationFrame(loop);}
document.getElementById(p+'t').addEventListener('input',function(){
temp=parseFloat(this.value);
document.getElementById(p+'l').textContent=Math.round(temp)+'°C';
var m=mode(),st=document.getElementById(p+'st');
if(m==0)st.innerHTML='温度低于 <b>0°C</b>，水凝固成冰。';
else if(temp===0)st.innerHTML='正好 <b>0°C</b>：冰和水可以互相变化。';
else if(m==1)st.innerHTML='液态水。温度升到 <b>100°C</b> 时会沸腾。';
else st.innerHTML='温度超过 <b>100°C</b>，水变成水蒸气。';});
document.getElementById(p+'t').dispatchEvent(new Event('input'));
loop();});

D("声音振动","声音的产生：振动、强弱、高低","调整振幅和频率，看声波怎么变",
function(p){return '<canvas id="'+p+'cv" width="640" height="200" style="background:#0E1631;border-radius:10px;width:100%;display:block"></canvas>'
+'<div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;align-items:center">'
+'<label style="font-size:13px">用力程度（振幅）<input type="range" id="'+p+'a" min="1" max="10" value="4"></label>'
+'<label style="font-size:13px">物体振动快慢（频率）<input type="range" id="'+p+'f" min="1" max="10" value="3"></label></div>'
+'<div id="'+p+'st" style="margin-top:8px;font-size:14px"></div>';},
function(p){
var cv=document.getElementById(p+'cv'),ctx=cv.getContext('2d');
var ph=0;
function loop(){
if(!document.getElementById(p+'cv'))return;
var A=parseFloat(document.getElementById(p+'a').value);
var F=parseFloat(document.getElementById(p+'f').value);
ph+=0.15;
ctx.fillStyle='#0E1631';ctx.fillRect(0,0,640,200);
ctx.strokeStyle='#3B4A7E';ctx.beginPath();ctx.moveTo(0,100);ctx.lineTo(640,100);ctx.stroke();
ctx.strokeStyle='#6FB7FF';ctx.lineWidth=2.5;ctx.beginPath();
for(var x=0;x<=640;x+=2){var y=100+Math.sin(x*0.05*F+ph)*A*8;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
ctx.stroke();
ctx.fillStyle='#E8ECF6';ctx.font='bold 13px sans-serif';
ctx.fillText('振幅×'+A+'  频率×'+F,12,20);
ctx.fillStyle='rgba(255,216,102,'+(A/12)+')';ctx.beginPath();ctx.arc(320,100,10+A*3,0,Math.PI*2);ctx.fill();
requestAnimationFrame(loop);}
function upd(){var A=parseFloat(document.getElementById(p+'a').value),F=parseFloat(document.getElementById(p+'f').value);
document.getElementById(p+'st').innerHTML='振幅越大，振动幅度越大，声音越<b>强</b>（越响）；振动越快（频率越高），声音越<b>高</b>（越尖）。现在：'+(A>6?'用力敲，声音强':'轻轻碰，声音弱')+'，'+(F>6?'振动快，声音高':'振动慢，声音低')+'。';}
document.getElementById(p+'a').addEventListener('input',upd);
document.getElementById(p+'f').addEventListener('input',upd);
upd();loop();});

function chip(el,items,cur,fn){
var h='<span class="chiplab">'+el.lab+'</span>';
for(var i=0;i<items.length;i++)h+='<span class="chip'+(items[i]===cur?' on':'')+(el.star?' star':'')+'" data-v="'+esc(items[i])+'">'+esc(items[i])+'</span>';
var node=document.getElementById(el.id);node.innerHTML=h;

for(var j=0;j<cs.length;j++)cs[j].addEventListener('click',function(){fn(this.getAttribute('data-v'));});
}
